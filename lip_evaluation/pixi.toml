[workspace]
channels = ["conda-forge"]
name = "lip_eval"
platforms = ["linux-64", "linux-aarch64"]
version = "1.0.0"

[dependencies]
python = ">=3.10,<3.13"
matplotlib = ">=3.0"
numpy = ">=1.24"

[pypi-dependencies]
torch = ">=2.0"

[tasks]
# Appendix A: training run of Figure "Training of a Koopman DCM estimator on a LIP model"
train = "python -m lip_eval --steps 200000 --epochs 100 --hist-size 10 --omega-init 4.0 --com-loss-weight 1.0"

# Appendix A.1: CoM-loss weight sweep (table and figure)
com-loss-sweep = "python -m lip_eval.com_loss_sweep --steps 50000 --epochs 50 --samples 3 --hist-size 10 --omega-init 1.0"

# Appendix A.2: delay-embedding horizon sweep (table)
history-sweep = "python -m lip_eval.history_sweep --steps 50000 --epochs 50 --samples 10 --omega-init 4.0"

# All of Appendix A, one task after the other
appendix = { depends-on = ["train", "com-loss-sweep", "history-sweep"] }
