[workspace]
channels = ["conda-forge"]
name = "lip_eval"
platforms = ["linux-64"]
version = "1.0.0"

[dependencies]
python = ">=3.10,<3.13"
matplotlib = ">=3.0"
numpy = ">=1.24"

[pypi-dependencies]
torch = ">=2.0"

[tasks]
# Appendix A: training run of Figure "Training of a Koopman DCM estimator on a LIP model"
train = "python -m lip_eval"

# Appendix A.1: CoM-loss weight sweep (table and figure)
com-loss-sweep = "python -m lip_eval.com_loss_sweep"

# Appendix A.2: delay-embedding horizon sweep (table)
history-sweep = "python -m lip_eval.history_sweep"
